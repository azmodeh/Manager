# Keyboard Configuration for Manager Bot
# Persian keyboard layouts and button configurations

admin_panel:
  main_buttons:
    - row: 1
      buttons:
        - text: "خوش‌آمدگویی"
          callback_data: "welcome|MENU"
        - text: "قوانین گروه"
          callback_data: "rules|MENU"
    - row: 2
      buttons:
        - text: "مدیریت اعضا"
          callback_data: "members|MENU"
        - text: "تنظیمات گروه"
          callback_data: "settings|MENU"

feature_menus:
  welcome:
    title: "تنظیمات خوش‌آمدگویی"
    buttons:
      - row: 1
        buttons:
          - text: "وضعیت: {status}"
            callback_data: "welcome|TOGGLE"
      - row: 2
        buttons:
          - text: "ویرایش متن"
            callback_data: "welcome|EDIT_TEXT"
          - text: "ویرایش دکمه‌ها"
            callback_data: "welcome|EDIT_BUTTONS"
      - row: 3
        buttons:
          - text: "🔙 بازگشت"
            callback_data: "welcome|BACK"

  rules:
    title: "تنظیمات قوانین"
    buttons:
      - row: 1
        buttons:
          - text: "وضعیت: {status}"
            callback_data: "rules|TOGGLE"
      - row: 2
        buttons:
          - text: "ویرایش متن"
            callback_data: "rules|EDIT_TEXT"
          - text: "ویرایش دکمه‌ها"
            callback_data: "rules|EDIT_BUTTONS"
      - row: 3
        buttons:
          - text: "🔙 بازگشت"
            callback_data: "rules|BACK"

  members:
    title: "مدیریت اعضا"
    buttons:
      - row: 1
        buttons:
          - text: "لیست اعضا"
            callback_data: "members|LIST"
          - text: "اعضای محدود"
            callback_data: "members|RESTRICTED"
      - row: 2
        buttons:
          - text: "تنظیمات عضویت"
            callback_data: "members|SETTINGS"
      - row: 3
        buttons:
          - text: "🔙 بازگشت"
            callback_data: "members|BACK"

  settings:
    title: "تنظیمات گروه"
    buttons:
      - row: 1
        buttons:
          - text: "زبان ربات"
            callback_data: "settings|LANGUAGE"
          - text: "پیشوند دستورات"
            callback_data: "settings|PREFIX"
      - row: 2
        buttons:
          - text: "تنظیمات پیشرفته"
            callback_data: "settings|ADVANCED"
      - row: 3
        buttons:
          - text: "🔙 بازگشت"
            callback_data: "settings|BACK"

# Status labels
status_labels:
  enabled: "✅ فعال"
  disabled: "❌ غیرفعال"
  on: "روشن"
  off: "خاموش"

# Common buttons
common_buttons:
  back: "🔙 بازگشت"
  cancel: "❌ لغو"
  confirm: "✅ تأیید"
  edit: "✏️ ویرایش"
  delete: "🗑️ حذف"
  save: "💾 ذخیره"
  settings: "⚙️ تنظیمات"