# Keyboard Templates Configuration
admin_panel:
  main:
    - text_key: "admin.buttons.general"
      emoji_key: "keyboard.admin.settings"
      callback: "admin_general"
    - text_key: "admin.buttons.groups"
      emoji_key: "keyboard.admin.users"
      callback: "admin_groups"
    - text_key: "admin.buttons.stats"
      emoji_key: "keyboard.admin.chart"
      callback: "admin_stats"
    - text_key: "admin.buttons.restart"
      emoji_key: "keyboard.admin.refresh"
      callback: "admin_restart"

group_settings:
  main:
    - text_key: "group.buttons.welcome"
      emoji_key: "keyboard.group.party"
      callback: "group_welcome"
    - text_key: "group.buttons.rules"
      emoji_key: "keyboard.group.clipboard"
      callback: "group_rules"
    - text_key: "group.buttons.general"
      emoji_key: "keyboard.admin.settings"
      callback: "group_general"
    - text_key: "common.buttons.back"
      emoji_key: "keyboard.common.back"
      callback: "back_main"

welcome_settings:
  config:
    - text_key: "common.buttons.enable"
      emoji_key: "keyboard.common.check"
      callback: "welcome_enable"
    - text_key: "common.buttons.disable"
      emoji_key: "keyboard.common.cross"
      callback: "welcome_disable"
    - text_key: "common.buttons.edit_text"
      emoji_key: "keyboard.common.edit"
      callback: "welcome_edit_text"
    - text_key: "common.buttons.edit_media"
      emoji_key: "keyboard.common.image"
      callback: "welcome_edit_media"
    - text_key: "common.buttons.edit_buttons"
      emoji_key: "keyboard.common.button"
      callback: "welcome_edit_buttons"
    - text_key: "common.buttons.back"
      emoji_key: "keyboard.common.back"
      callback: "back_group"

rules_settings:
  config:
    - text_key: "common.buttons.enable"
      emoji_key: "keyboard.common.check"
      callback: "rules_enable"
    - text_key: "common.buttons.disable"
      emoji_key: "keyboard.common.cross"
      callback: "rules_disable"
    - text_key: "common.buttons.edit_text"
      emoji_key: "keyboard.common.edit"
      callback: "rules_edit_text"
    - text_key: "common.buttons.edit_media"
      emoji_key: "keyboard.common.image"
      callback: "rules_edit_media"
    - text_key: "common.buttons.edit_buttons"
      emoji_key: "keyboard.common.button"
      callback: "rules_edit_buttons"
    - text_key: "common.buttons.back"
      emoji_key: "keyboard.common.back"
      callback: "back_group"

approval:
  pending:
    - text_key: "admin.buttons.approve"
      emoji_key: "keyboard.common.check"
      callback: "approve_group"
    - text_key: "admin.buttons.reject"
      emoji_key: "keyboard.common.cross"
      callback: "reject_group"