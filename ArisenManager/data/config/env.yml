# Telegram Configuration - References to Environment Variables
telegram:
  api_id_env: "TELEGRAM_API_ID"
  api_hash_env: "TELEGRAM_API_HASH"
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  phone_number_env: "TELEGRAM_PHONE_NUMBER"
  sudo_env: "TELEGRAM_SUDO"
  session_string_env: "TELEGRAM_SESSION_STRING"

# Group Management
groups:
  auto_approve: false
  welcome_enabled: false
  rules_enabled: false

# Bot Settings
bot:
  start_enabled: false
  help_enabled: false
  language: "fa"  # Persian by default

# AI Configuration - References to Environment Variables
ai:
  # Primary (OpenRouter)
  primary_base_url: "https://openrouter.ai/api/v1"
  primary_api_key_env: "OPENROUTER_API_KEY"
  primary_model: "meta-llama/llama-3.3-70b-instruct:free"
  
  # Fallback 1 (Gemini)
  fallback1_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  fallback1_api_key_env: "GEMINI_API_KEY"
  fallback1_model: "gemini-2.0-flash"
  
  # Fallback 2 (Mistral)
  fallback2_base_url: "https://api.mistral.ai/v1/"
  fallback2_api_key_env: "MISTRAL_API_KEY"
  fallback2_model: "mistral-medium-latest"

# Database Configuration - References to Environment Variables
database:
  type: "postgresql"
  url_env: "DATABASE_URL"

# Sessions (will be generated automatically)
sessions:
  userbot_session: ""  # Will be filled automatically
  apibot_session: ""   # Will be filled automatically

# Qdrant Configuration - References to Environment Variables
qdrant:
  url_env: "QDRANT_URL"
  api_key_env: "QDRANT_API_KEY"
  collection_env: "QDRANT_COLLECTION"
  timeout_ms_env: "QDRANT_TIMEOUT_MS"